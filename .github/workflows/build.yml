name: Build
on:
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install innoextract build dependencies
        # dist.sh builds innoextract from source (see its comment for why).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libboost-all-dev liblzma-dev pkg-config upx-ucl

      - name: Build
        run: |
          chmod +x dist.sh
          chmod +x build.sh
          ./dist.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zoom-platform
          path: zoom-platform.sh

      - name: Release if tag
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "zoom-platform.sh"
          omitBody: true
          allowUpdates: true
