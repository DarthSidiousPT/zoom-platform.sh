name: Build (Darth fork)

# Fork-only build: produces a renamed zoom-platform-darth.sh and publishes it to a
# rolling "darth-latest" GitHub Release on every push to this fork's main, plus a
# permanent release tagged from the VERSION file's own content (e.g. "Darth-1.0.2" - an
# independent version string, not derived from ZOOM's own version numbers) whenever
# that hasn't been released yet (same VERSION-file-driven scheme as the innoextract
# fork's own darth-build.yml - bump VERSION by hand to cut a new fork release; a plain
# push that doesn't touch it just refreshes darth-latest). Guarded by the repository
# check below so that if this file is ever pulled into Zoom's official repo (e.g. by
# accident via a future PR), it stays inert there instead of running.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'DarthSidiousPT/zoom-platform.sh'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Read fork version from VERSION file
        id: ver
        run: |
          version=$(cat VERSION)
          if [ -z "$version" ]; then
            echo "VERSION file is empty." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # VERSION already carries its own "Darth-" identifier (e.g. "Darth-1.0.2"),
          # so the tag is just that string as-is - no extra "darth-" prefix needed
          # (unlike darth-latest/the old per-commit-sha tags, which had nothing of
          # their own to identify them as fork builds).
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether that version was already released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" > /dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x dist.sh
          chmod +x build.sh
          ./dist.sh "${{ steps.ver.outputs.version }}"
          cp zoom-platform.sh zoom-platform-darth.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zoom-platform-darth
          path: zoom-platform-darth.sh

      - name: Move rolling darth-latest tag to this commit
        run: |
          git tag -f darth-latest
          git push -f origin darth-latest

      # ncipollo/release-action's allowUpdates only PATCHes the existing release object,
      # which keeps its original "published" date forever even though the tag/asset just
      # moved. Delete it first so the next step always does a fresh create instead, and
      # the release's date stays honest about when this build actually happened.
      - name: Delete previous rolling release (so its date reflects this build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete darth-latest --yes --repo "${{ github.repository }}" || true

      - name: Publish rolling latest release
        uses: ncipollo/release-action@v1
        with:
          tag: darth-latest
          artifacts: "zoom-platform-darth.sh"
          name: "Darth fork build (latest main)"
          body: "Automated build of zoom-platform.sh ${{ steps.ver.outputs.version }} from ${{ github.repository }}@${{ github.sha }}. Not an official ZOOM Platform release."
          allowUpdates: true
          makeLatest: false

      # Only published when VERSION was bumped, so a plain push to main that didn't
      # change VERSION just updates darth-latest above instead of minting a new tag.
      - name: Publish versioned release
        if: steps.check.outputs.is_new == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ steps.ver.outputs.tag }}"
          artifacts: "zoom-platform-darth.sh"
          name: "${{ steps.ver.outputs.version }}"
          body: "Automated build of zoom-platform.sh ${{ steps.ver.outputs.version }} from ${{ github.repository }}@${{ github.sha }}. Not an official ZOOM Platform release."
          allowUpdates: false
          makeLatest: false
