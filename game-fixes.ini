# Launchers for games whose own ZOOM Platform shortcut doesn't work under Proton.
#
# zoom-platform.sh reads this file from the main branch of this repository while it
# installs a game. It is optional: without network, or without a section for the game,
# the install goes on as it always did.
#
# One section per launcher, named [<ZOOM game GUID>/<launcher name>]:
#   replaces  the installer's shortcut this launcher stands in for (its name, as in the
#             Start Menu). Several sections can replace the same one, and then the
#             installer's own launcher is not made at all.
#   exe       what to start, a Windows path relative to the folder the replaced
#             shortcut's target is in, with "\" between the parts
#   workdir   the working directory, relative to the same folder. Optional, the folder
#             itself when left out
#   args      command line arguments. Optional
#
# Everything is checked before use, since it ends up in a generated shell script. Paths
# take letters, digits, space and . _ ( ) + , - only, and can't leave the game's folder.
# Arguments take letters, digits, space and + . _ , = : / - only.
# Unknown keys are ignored, so an older script can still read a newer file.
# Lines starting with # or ; are comments.

# Necro Vision - Hardcore Edition
#
# ZOOM's Launcher.exe starts the game with ShellExecute and no working directory, so the
# game runs from the install root. The engine only finds its scripts (../Data/...) when
# it starts in its own Bin folder, and Launcher.exe serves two games, so no single
# working directory suits it. Each button just starts <game>\Bin\NecroVisioN.exe, adding
# +Dx10 for DirectX 10. These do the same from the right folder.

[cdd12f52-c7f4-4775-8fce-3bf3251353e7/NecroVisioN DirectX 9]
replaces = Necro Vision - Hardcore Edition
exe      = NecroVisioN\Bin\NecroVisioN.exe
workdir  = NecroVisioN\Bin

[cdd12f52-c7f4-4775-8fce-3bf3251353e7/NecroVisioN DirectX 10]
replaces = Necro Vision - Hardcore Edition
exe      = NecroVisioN\Bin\NecroVisioN.exe
workdir  = NecroVisioN\Bin
args     = +Dx10

[cdd12f52-c7f4-4775-8fce-3bf3251353e7/NecroVisioN Lost Company DirectX 9]
replaces = Necro Vision - Hardcore Edition
exe      = NecroVisioN Lost Company\Bin\NecroVisioN.exe
workdir  = NecroVisioN Lost Company\Bin

[cdd12f52-c7f4-4775-8fce-3bf3251353e7/NecroVisioN Lost Company DirectX 10]
replaces = Necro Vision - Hardcore Edition
exe      = NecroVisioN Lost Company\Bin\NecroVisioN.exe
workdir  = NecroVisioN Lost Company\Bin
args     = +Dx10
